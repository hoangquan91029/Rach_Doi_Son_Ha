<path d="M580 730 L650 900 L755 1050 L820 1148 L866 1168" fill="none" stroke="#e47c36" stroke-width="38" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrowFar)"/>
<path d="M520 355 L450 410 L395 475" fill="none" stroke="#e47c36" stroke-width="32" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrowFar)"/>
<!-- NEAR limbs are overlaid: near leg trails upper-left; near arm swings forward -->
<path d="M700 735 L560 865 L500 1015 L465 1090 L495 1100" fill="none" stroke="#43b7c9" stroke-width="46" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrowNear)"/>
<path d="M790 355 L830 420 L875 500" fill="none" stroke="#43b7c9" stroke-width="34" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrowNear)"/>
<!-- joint markers -->
<g fill="#f4ead2" stroke="#263331" stroke-width="7"><circle cx="580" cy="730" r="24"/><circle cx="650" cy="900" r="25"/><circle cx="755" cy="1050" r="25"/><circle cx="700" cy="735" r="25"/><circle cx="560" cy="865" r="26"/><circle cx="500" cy="1015" r="25"/><circle cx="520" cy="355" r="20"/><circle cx="450" cy="410" r="20"/><circle cx="790" cy="355" r="20"/><circle cx="830" cy="420" r="20"/></g>
