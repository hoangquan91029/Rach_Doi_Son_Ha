<svg xmlns="http://www.w3.org/2000/svg" width="1254" height="1254" viewBox="0 0 1254 1254">
<title>MODEL_ONLY F04 far-leg-leading pose geometry guide</title>
<desc>Transparent geometry diagram only. Not painted art or motion evidence. Gray body and hat framing approximate measured F00 placement; orange FAR limbs lead lower-right and sweep backward; cyan NEAR limbs trail upper-left with near arm swinging forward.</desc>
<defs><marker id="arrowFar" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#e47c36"/></marker><marker id="arrowNear" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#43b7c9"/></marker></defs>
<!-- fixed hat, head, shoulder, pelvis alignment guides measured from F00 -->
<path d="M624 67 L508 222 Q666 270 838 215 Z" fill="#b79b68" fill-opacity=".12" stroke="#e9dfcb" stroke-width="12"/>
<path d="M508 222 Q666 270 838 215" fill="none" stroke="#e9dfcb" stroke-width="14"/>
<ellipse cx="682" cy="204" rx="54" ry="72" fill="#e9dfcb" fill-opacity=".15" stroke="#e9dfcb" stroke-width="12"/>
<path d="M672 278 L672 347 M535 356 L790 356 M580 730 Q643 700 700 735 M672 356 L650 581 L640 710" fill="none" stroke="#e9dfcb" stroke-opacity=".78" stroke-width="22" stroke-linecap="round"/>
<path d="M535 356 Q505 462 538 570 L602 635 L700 646 L770 585 Q798 480 790 356" fill="#e9dfcb" fill-opacity=".08" stroke="#e9dfcb" stroke-opacity=".7" stroke-width="12"/>
