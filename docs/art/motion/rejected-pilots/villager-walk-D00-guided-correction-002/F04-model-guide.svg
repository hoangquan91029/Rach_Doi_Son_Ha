<text x="850" y="1000" fill="#e47c36">FAR LEG LEADS</text><text x="285" y="930" fill="#43b7c9">NEAR LEG TRAILS</text><text x="835" y="470" fill="#43b7c9">NEAR ARM FORWARD</text><text x="292" y="370" fill="#e47c36">FAR ARM BACK</text><text x="690" y="1138">ROOT 650,1140</text>
</g>
