<!doctype html><meta charset="utf-8"><title>Whole clothed authoring guide — unqualified</title><style>body{background:#292b29;color:#eee;font:16px system-ui}canvas{background:#73786d;image-rendering:auto;margin:20px}button{font:inherit}.small{width:70.56px;height:70.56px}</style><h1>Whole clothed 2D authoring guide</h1><p>AUTHORING ONLY · no image order · no final art, contact, stride or owner approval.</p><button id="toggle">Pause</button><span id="phase"></span><p>Actual whole canvas 70.56px and illustrative 256px view. Persistent A/B calf-wrap and sandal lanes; no source pixels.</p><canvas class="small" width="256" height="256"></canvas><canvas width="256" height="256"></canvas><script>const canvases=[...document.querySelectorAll('canvas')], images=Array.from({length:8},(_,i)=>{const a=new Image();a.src='F'+i+'.svg';return a});let running=true,time=0,last;document.querySelector('button').onclick=()=>{running=!running;document.querySelector('button').textContent=running?'Pause':'Resume'};function draw(now){if(last!==undefined&&running)time+=now-last;last=now;const f=Math.floor(time/75)%8;for(const c of canvases){const x=c.getContext('2d');x.clearRect(0,0,256,256);if(images[f].complete)x.drawImage(images[f],0,0)}document.querySelector('#phase').textContent=' F'+f;requestAnimationFrame(draw)}requestAnimationFrame(draw)</script>
