<!doctype html><meta charset="utf-8"><title>Actual gather candidate preview</title><h1>Actual gather_wood candidate — technical playback</h1><button id="pause">Pause</button><canvas width="280" height="180"></canvas><p id="status">Loading actual client raster pipeline…</p>
<script type="module">
import {createArtAssetPipeline} from '/client/art-assets.js';
const pipeline=createArtAssetPipeline({manifestUrl:new URL('manifest.json',location.href).href,allowCandidates:true});await pipeline.preload();if(pipeline.stats.failed||pipeline.stats.skipped)throw Error(JSON.stringify(pipeline.stats));const asset=pipeline.manifest.assets.find(a=>a.state==='gather_wood'&&a.direction===1);if(!asset||asset.frames.length!==8)throw Error('Actual selected gather8 required');const c=document.querySelector('canvas'),ctx=c.getContext('2d');let clock=0,last=performance.now(),paused=false;const seen=new Set();document.querySelector('#pause').onclick=()=>paused=!paused;
function drawRaster(r){ctx.drawImage(r.image,r.sx,r.sy,r.sw,r.sh,140-r.pivot.x/r.sw*r.render.width,145-r.pivot.y/r.sh*r.render.height,r.render.width,r.render.height)}
function draw(now){if(!paused)clock+=now-last;last=now;ctx.fillStyle='#56674b';ctx.fillRect(0,0,280,180);const r=pipeline.get(asset.id,{state:'gather_wood',direction:1,timeMs:clock});drawRaster(pipeline.get(r.contactShadow.assetId));drawRaster(r);seen.add(r.frame);window.gatherDiagnostic={frame:r.frame,frames:8,seen:[...seen],clock,paused,cycleMs:r.animationDurationMs,stats:pipeline.stats};document.querySelector('#status').textContent=`F${r.frame} / actual1080ms timing · candidate only`;requestAnimationFrame(draw)}requestAnimationFrame(draw);
</script>
