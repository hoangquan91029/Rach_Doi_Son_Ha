<!doctype html><meta charset="utf-8"><title>Eight-frame candidate technical preview</title><style>body{background:#303b32;color:white;font:16px system-ui}canvas{display:block}button{font:inherit}</style><h1 id="label">Loading</h1><p>Eight actual declared frames. Local real-size playback only; no travel or motion acceptance.</p><button id="pause">Pause</button><span id="phase"></span><canvas></canvas>
<script type="module">
const m=await fetch('preview.json').then(r=>r.json()),im=new Image();im.src='atlas.png';await im.decode();if(m.frames.length!==8)throw Error('Eight frames required');let shadowImage=null;if(m.shadow){shadowImage=new Image();shadowImage.src=m.shadow.runtime.path;await shadowImage.decode()}document.querySelector('#label').textContent=m.status;
const c=document.querySelector('canvas'),ctx=c.getContext('2d');c.width=Math.max(260,m.render.width+80);c.height=Math.max(200,m.render.height+80);c.style.width=c.width+'px';c.style.height=c.height+'px';
let clock=0,last=performance.now(),paused=false;document.querySelector('#pause').onclick=()=>{paused=!paused;document.querySelector('#pause').textContent=paused?'Play':'Pause'};
function draw(now){if(!paused)clock+=now-last;last=now;let t=clock%m.cycleDurationMs,index=0;for(let i=0;i<8;i++){if(t<m.frames[i].durationMs){index=i;break}t-=m.frames[i].durationMs}const f=m.frames[index],sx=m.render.width/m.sourceCanvas[0],sy=m.render.height/m.sourceCanvas[1],x=c.width/2,y=c.height-35;ctx.clearRect(0,0,c.width,c.height);ctx.strokeStyle='#9aa';ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(c.width,y);ctx.stroke();if(shadowImage){const a=m.shadow,s=a.frames[0];ctx.drawImage(shadowImage,s.x,s.y,s.width,s.height,x-a.pivot.x*a.render.width/a.source.width,y-a.pivot.y*a.render.height/a.source.height,a.render.width,a.render.height)}ctx.drawImage(im,f.x,f.y,f.width,f.height,x-m.sourcePivot[0]*sx,y-m.sourcePivot[1]*sy,m.render.width,m.render.height);document.querySelector('#phase').textContent=`F${index} ${f.durationMs}ms`;window.atlasDiagnostic={status:m.status,frame:index,frames:8,clock,paused};requestAnimationFrame(draw)}requestAnimationFrame(draw);
</script>
