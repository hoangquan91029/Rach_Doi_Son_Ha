<!doctype html><meta charset="utf-8"><title>179 tonal rough authoring</title><style>body{background:#434840;color:#eee;font:14px sans-serif}img{width:89px;height:89px}button{margin:8px}.strip{display:flex}</style><p>179 whole tonal rough — authoring only. 600ms / 8 × 75ms. Canonical shown separately.</p><img id="pose" src="F00-tonal.png"><img src="../../characters/villager-neutral-D00-screen-ESE/raw.png"><button id="pause">Pause</button><button id="step">Step</button><span id="phase"></span><div class="strip" id="strip"></div><script>let frame=0,running=true;const phases=['contact A','down A','passing A','up A','contact B','down B','passing B','up B'];function show(){pose.src=`F0${frame}-tonal.png`;phase.textContent=`F${frame} ${phases[frame]}`;}for(let i=0;i<8;i++){let im=document.createElement('img');im.src=`F0${i}-tonal.png`;strip.append(im)}pause.onclick=()=>{running=!running;pause.textContent=running?'Pause':'Play'};step.onclick=()=>{running=false;pause.textContent='Play';frame=(frame+1)%8;show()};setInterval(()=>{if(running){frame=(frame+1)%8;show()}},75);show();</script>
