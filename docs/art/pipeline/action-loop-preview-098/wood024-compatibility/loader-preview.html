<!doctype html><meta charset="utf-8"><title>Actual action technical preview</title><h1 id="label">Loading</h1><p>Actual selected frames; technical compatibility only.</p><button id="pause">Pause</button><button id="replay">Replay</button><canvas></canvas><p id="status"></p>
<script type="module">
import {createArtAssetPipeline} from '/client/art-assets.js';
const layout=await fetch('preview-layout.json').then(r=>r.json()),pipeline=createArtAssetPipeline({manifestUrl:new URL('manifest.json',location.href).href,allowCandidates:true});await pipeline.preload();if(pipeline.stats.failed||pipeline.stats.skipped)throw Error(JSON.stringify(pipeline.stats));const asset=pipeline.manifest.assets[0];document.querySelector('#label').textContent=`${asset.state} / D${asset.direction} — technical preview`;
const c=document.querySelector('canvas'),ctx=c.getContext('2d');c.width=layout.width;c.height=layout.height;let clock=0,last=performance.now(),paused=false;const seen=new Set();document.querySelector('#pause').onclick=()=>{paused=!paused;document.querySelector('#pause').textContent=paused?'Play':'Pause'};document.querySelector('#replay').onclick=()=>{clock=0;paused=false;last=performance.now();seen.clear();document.querySelector('#pause').textContent='Pause'};
function drawRaster(r){ctx.drawImage(r.image,r.sx,r.sy,r.sw,r.sh,layout.anchor[0]-r.pivot.x/r.sw*r.render.width,layout.anchor[1]-r.pivot.y/r.sh*r.render.height,r.render.width,r.render.height)}
function draw(now){if(!paused)clock+=now-last;last=now;ctx.fillStyle=layout.background;ctx.fillRect(0,0,c.width,c.height);const r=pipeline.get(asset.id,{state:asset.state,direction:asset.direction,timeMs:clock});if(r.contactShadow.mode==='separate')drawRaster(pipeline.get(r.contactShadow.assetId));drawRaster(r);seen.add(r.frame);window.actionDiagnostic={state:asset.state,direction:asset.direction,frame:r.frame,frames:asset.frames.length,seen:[...seen],clock,paused,loop:asset.loop,finished:!asset.loop&&clock>=r.animationDurationMs,cycleMs:r.animationDurationMs,stats:pipeline.stats};document.querySelector('#status').textContent=`F${r.frame} / ${r.animationDurationMs}ms · ${asset.loop?'loop':'terminal hold'} · candidate only`;requestAnimationFrame(draw)}requestAnimationFrame(draw);
</script>
