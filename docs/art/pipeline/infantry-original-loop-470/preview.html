<!doctype html><meta charset="utf-8"><title>Original infantry walk — candidate</title><style>body{background:#23312a;color:#eddfb9;font:16px system-ui;padding:36px}section{display:flex;gap:48px;margin-top:32px}figure{margin:0;width:160px}canvas{display:block;width:70.56px;height:70.56px}figcaption{font-size:12px;margin-top:12px}button{margin-top:24px;padding:9px 18px;background:#eddfb9;color:#23312a;border:0}p{max-width:560px}</style><h2>Same original infantry · D0 walk candidate</h2><p>Gameplay size: 42 × 1.68 = 70.56 px square. Eight whole illustrated frames, fixed pivot, 720 ms. Preview only; world foot contact and runtime integration remain open.</p><section><figure><canvas id="original" width="128" height="128"></canvas><figcaption>Original identity</figcaption></figure><figure><canvas id="motion" width="128" height="128"></canvas><figcaption id="label">F0</figcaption></figure></section><button id="toggle">Pause</button><p id="status">Loading illustrated atlas…</p><script>
const atlas=new Image(),ctx=motion.getContext('2d'),base=original.getContext('2d');let running=true,time=0,last=0;window.previewState={ready:false,frame:0,seen:[],cycles:0,errors:[]};atlas.src='atlas.png';atlas.onerror=()=>previewState.errors.push('atlas decode');atlas.onload=()=>{base.drawImage(atlas,2,2,128,128,0,0,128,128);previewState.ready=true;requestAnimationFrame(draw)};toggle.onclick=()=>{running=!running;toggle.textContent=running?'Pause':'Play';last=0;};function draw(now){if(last&&running)time+=Math.min(100,now-last);last=now;const frame=Math.floor(time/90)%8;ctx.clearRect(0,0,128,128);ctx.drawImage(atlas,2+frame%4*132,2+Math.floor(frame/4)*132,128,128,0,0,128,128);previewState.frame=frame;previewState.cycles=Math.floor(time/720);previewState.running=running;previewState.elapsed=time;if(!previewState.seen.includes(frame))previewState.seen.push(frame);label.textContent='F'+frame;status.textContent='8 illustrated frames · '+previewState.cycles+' cycles · '+(running?'playing':'paused');requestAnimationFrame(draw)}
</script>
